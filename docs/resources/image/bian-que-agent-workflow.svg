<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-labelledby="title desc">
  <title id="title">Bian Que Agent 工作流</title>
  <desc id="desc">展示 Bian Que 从事件解析、Skill 匹配、上下文富化、证据收集、推理排序、缓解计划到反馈学习的工作流。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#ecfeff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L10,6 L2,10 Z" fill="#0f766e"/></marker>
    <style>
      .title{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.sub{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}.step{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.body{font:500 12.5px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}.num{font:800 20px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#fff}.line{stroke:#0f766e;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1180" height="520" rx="28" fill="url(#bg)"/>
  <text x="590" y="52" text-anchor="middle" class="title">Bian Que Agent 工作流拆解</text>
  <text x="590" y="82" text-anchor="middle" class="sub">把自然语言/告警事件转化为可审计、可执行、可反馈的生产运维闭环</text>

  <g filter="url(#shadow)">
    <rect x="55" y="142" width="132" height="170" rx="20" fill="#fff"/>
    <rect x="214" y="142" width="132" height="170" rx="20" fill="#fff"/>
    <rect x="373" y="142" width="132" height="170" rx="20" fill="#fff"/>
    <rect x="532" y="142" width="132" height="170" rx="20" fill="#fff"/>
    <rect x="691" y="142" width="132" height="170" rx="20" fill="#fff"/>
    <rect x="850" y="142" width="132" height="170" rx="20" fill="#fff"/>
    <rect x="1009" y="142" width="132" height="170" rx="20" fill="#fff"/>
  </g>
  <g>
    <circle cx="121" cy="142" r="24" fill="#0f766e"/><text x="121" y="149" text-anchor="middle" class="num">1</text>
    <circle cx="280" cy="142" r="24" fill="#0f766e"/><text x="280" y="149" text-anchor="middle" class="num">2</text>
    <circle cx="439" cy="142" r="24" fill="#0f766e"/><text x="439" y="149" text-anchor="middle" class="num">3</text>
    <circle cx="598" cy="142" r="24" fill="#0f766e"/><text x="598" y="149" text-anchor="middle" class="num">4</text>
    <circle cx="757" cy="142" r="24" fill="#0f766e"/><text x="757" y="149" text-anchor="middle" class="num">5</text>
    <circle cx="916" cy="142" r="24" fill="#0f766e"/><text x="916" y="149" text-anchor="middle" class="num">6</text>
    <circle cx="1075" cy="142" r="24" fill="#0f766e"/><text x="1075" y="149" text-anchor="middle" class="num">7</text>
  </g>
  <text x="121" y="195" text-anchor="middle" class="step">Parse</text><text x="121" y="226" text-anchor="middle" class="body">抽取服务</text><text x="121" y="248" text-anchor="middle" class="body">时间窗口</text><text x="121" y="270" text-anchor="middle" class="body">症状/影响</text>
  <text x="280" y="195" text-anchor="middle" class="step">Skill Match</text><text x="280" y="226" text-anchor="middle" class="body">匹配日志</text><text x="280" y="248" text-anchor="middle" class="body">指标/变更</text><text x="280" y="270" text-anchor="middle" class="body">Runbook</text>
  <text x="439" y="195" text-anchor="middle" class="step">Enrich</text><text x="439" y="226" text-anchor="middle" class="body">服务画像</text><text x="439" y="248" text-anchor="middle" class="body">依赖拓扑</text><text x="439" y="270" text-anchor="middle" class="body">历史 Case</text>
  <text x="598" y="195" text-anchor="middle" class="step">Collect</text><text x="598" y="226" text-anchor="middle" class="body">并行查询</text><text x="598" y="248" text-anchor="middle" class="body">指标/日志</text><text x="598" y="270" text-anchor="middle" class="body">发布系统</text>
  <text x="757" y="195" text-anchor="middle" class="step">Reason</text><text x="757" y="226" text-anchor="middle" class="body">候选根因</text><text x="757" y="248" text-anchor="middle" class="body">证据排序</text><text x="757" y="270" text-anchor="middle" class="body">置信度</text>
  <text x="916" y="195" text-anchor="middle" class="step">Mitigate</text><text x="916" y="226" text-anchor="middle" class="body">观察/扩容</text><text x="916" y="248" text-anchor="middle" class="body">限流/切流</text><text x="916" y="270" text-anchor="middle" class="body">回滚/升级</text>
  <text x="1075" y="195" text-anchor="middle" class="step">Feedback</text><text x="1075" y="226" text-anchor="middle" class="body">采纳结果</text><text x="1075" y="248" text-anchor="middle" class="body">执行效果</text><text x="1075" y="270" text-anchor="middle" class="body">复盘沉淀</text>

  <path d="M187 227 H214" class="line"/><path d="M346 227 H373" class="line"/><path d="M505 227 H532" class="line"/><path d="M664 227 H691" class="line"/><path d="M823 227 H850" class="line"/><path d="M982 227 H1009" class="line"/>

  <rect x="95" y="380" width="990" height="68" rx="22" fill="#ccfbf1" stroke="#5eead4" stroke-width="2"/>
  <text x="590" y="410" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#134e4a">生产化关键点：每一步都有输入 Schema、超时、权限、审计、回滚语义和人工接管点</text>
  <text x="590" y="436" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#0f766e">避免让 LLM 直接裸调生产系统，将复杂推理约束在可编排、可验证、可复盘的工作流中</text>
</svg>
